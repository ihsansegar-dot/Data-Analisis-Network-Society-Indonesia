<body><article><p>Harga cabai rawit di pasar induk naik tajam pekan ini karena pasokan dari sentra produksi berkurang akibat cuaca buruk yang berkepanjangan.</p>
<p>Pedagang memperkirakan harga akan kembali normal dalam dua minggu ke depan apabila panen di daerah produsen berjalan lancar seperti biasa.</p></article></body></html>
