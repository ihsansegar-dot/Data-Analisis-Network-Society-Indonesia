# Kamus kategori untuk identifikasi otomatis. version: 2 (revisi Nov 2026, lihat catatan di akhir file)
version: 2
# Kamus kategori (codebook awal) untuk identifikasi otomatis.
# - Semua istilah huruf kecil; dicocokkan per kata/frasa utuh, tidak peka huruf besar/kecil.
# - Bobot: 3 = sangat khas kategori, 2 = khas, 1 = pendukung (sering muncul di konteks lain).
# - Kemunculan di JUDUL dihitung x2. Tiap istilah dihitung maksimal 3 kali per artikel.
# - Artikel diberi label kategori bila skornya >= min_score (multi-label);
#   kategori utama = skor tertinggi.
# PENTING: ini titik awal, bukan instrumen yang sudah tervalidasi. Uji dengan sampel
# yang dikode manual (lihat README) dan sesuaikan istilahnya.

relevance:
  # Artikel hanya disimpan bila memuat >= min_terms istilah konteks keislaman.
  min_terms: 2
  # Istilah yang juga dipakai di luar konteks Islam: ikut dihitung, tetapi minimal satu istilah lain harus ada.
  weak_terms: [umat, ummat, kemenag, kementerian agama, haji, nabi, ibadah, pan, ppp, persis, nu, ansor]
  terms: [islam, islami, islamic, muslim, muslimah, umat islam, umat, ummat, ulama, kiai, kyai, ustaz, ustadz,
          habib, santri, pesantren, masjid, musala, musholla, syariah, syariat, halal, fatwa, mui,
          majelis ulama indonesia, nahdlatul ulama, nu, pbnu, muhammadiyah, persis, al washliyah, dakwah,
          zakat, wakaf, haji, umrah, ramadan, ramadhan, idulfitri, iduladha, kemenag, kementerian agama,
          partai islam, pks, partai keadilan sejahtera, pkb, partai kebangkitan bangsa, ppp,
          partai persatuan pembangunan, pan, partai amanat nasional, partai bulan bintang, partai ummat,
          masyumi, ormas islam, alquran, al-quran, quran, nabi, rasulullah, ukhuwah, khilafah,
          shalat, salat, sholat, khutbah, khutbah jumat, fiqih, fikih, fiqh, hadis, hadits, sunnah, ibadah, takmir,
          jemaah haji, jamaah haji, ibadah haji, kuota haji, kementerian haji, kemenhaj, bpkh, lazisnu, lazismu,
          baznas, mudzakarah, bahtsul masail, fatayat, muslimat nu, ansor, banser, aisyiyah, pemuda muhammadiyah]

min_score: 3

# Istilah ambigu -> konteks yang membatalkannya (run 2: "Mau Bayar PKB? Cek Samsat Keliling" berlabel Partai Islam).
ambiguous:
  pkb: [samsat, pajak kendaraan, kendaraan bermotor, bbnkb, stnk]
  pan: [peter pan, pan-arab, pan arab]
  pks: [pekerja seks]
  ppp: [public private partnership, purchasing power parity, kerja sama pemerintah dan badan usaha]

# Judul konten panduan ibadah (doa, niat, tata cara) — bukan berita; tidak diberi kategori dan tidak ikut
# sna_explorer.csv (kolom jenis di articles.csv). Run 2: banyak di Liputan6 dan Media Indonesia.
# Pola tambahan (dicari di mana saja dalam judul): kisah/fikih/tips/layanan, bukan berita (revisi v2)
non_news_title_any:
  - '^kisah (sahabat|para sahabat|nabi|rasul|para nabi|arab badui|semut|teladan)'
  - '\bkisah sahabat nabi\b'
  - '^contoh (khutbah|ceramah|kultum|doa)'
  - '^\d+ puisi'
  - '^apakah (shalat|salat|sholat|puasa|wudhu|wudu|haji|umrah|zakat)'
  - 'hukum [\w -]{2,30} (menurut|dalam) (islam|fikih|fiqih|syariat)'
  - '^(\d+ )?(cara|tips|rekomendasi|link download|ide) '
  - '^(\d+ )?(fakta|keutamaan|ayat|makna|arti|hikmah) '
  - '\boleh-oleh haji\b'
non_news_title: '^(\d+\s+)?(kumpulan |bacaan |lafal |teks )?(niat|doa|doa-doa|bacaan|amalan|tata cara (shalat|salat|sholat|wudhu|wudu|mandi|tayamum|puasa|zakat)|urutan (shalat|salat|sholat|wudhu|mandi)|keutamaan|khasiat|zikir|dzikir|surat al|surah|kultum|khutbah|hukum (shalat|salat|sholat|puasa|makan|membaca|menikah|nikah|memakai|membakar|menjarah|lupa|mencuri)|bolehkah|jadwal (waktu )?(shalat|salat|sholat|imsakiyah|imsak|puasa|buka puasa|sholat jumat))\b'

categories:
  identitas_keislaman:
    label: Identitas keislaman
    terms:
      3: [identitas islam, identitas muslim, identitas keislaman, jati diri umat, islamofobia, islamophobia, penistaan agama, penodaan agama, simbol agama, simbol islam, muslim kaffah, anti-muslim, anti muslim, kebencian terhadap muslim, merendahkan muslim, diskriminasi terhadap muslim, serangan terhadap muslim, penghina nabi, penghinaan nabi, penghinaan terhadap nabi]
      2: [hijab, jilbab, busana muslim, hijrah, syariat islam, ukhuwah islamiyah, label halal, gaya hidup halal, mualaf, muallaf]
      1: [syariah, syariat, halal, muslimah, kaffah, sertifikasi halal]

  politik_umat:
    label: Politik umat
    terms:
      3: [politik umat, politik islam, aspirasi umat, suara umat, pemilih muslim, ijtima ulama, aksi 212, gerakan 212, persaudaraan alumni 212, basis pemilih islam, kekuatan politik islam]
      2: [politik identitas, koalisi umat, dukungan ulama, umat islam memilih, poros islam, capres umat]
      1: [umat islam, umat, ormas islam]

  moralitas_kepemimpinan_islam:
    label: Moralitas dan kepemimpinan Islam
    terms:
      3: [kepemimpinan islam, pemimpin muslim, pemimpin amanah, akhlakul karimah, teladan rasulullah, uswah hasanah, kepemimpinan profetik]
      2: [pemimpin adil, zalim, dzalim, khalifah, integritas moral, moralitas, lgbt, lgbtq, asusila, perzinaan, kemaksiatan, maksiat]
      1: [moral, integritas, kejujuran, korupsi, amanah, akhlak, adab, judi online, miras]

  nasionalisme_religius:
    label: Nasionalisme religius
    terms:
      3: [nasionalisme religius, hubbul wathan, hubbul wathon, hubbul wathon minal iman, resolusi jihad, islam nusantara]
      2: [cinta tanah air, nkri harga mati, bela negara, wawasan kebangsaan, santri dan negara, nasionalis religius]
      1: [pancasila, kebangsaan, nkri, bhinneka tunggal ika, hari santri]

  moderasi_beragama:
    label: Moderasi beragama
    terms:
      3: [moderasi beragama, islam moderat, wasathiyah, washatiyah, rahmatan lil alamin, deradikalisasi, kerukunan umat beragama]
      2: [toleransi, intoleransi, radikalisme, ekstremisme, terorisme, fkub, dialog antaragama, dialog lintas agama]
      1: [kerukunan, radikal, moderat, pluralisme]

  ekonomi_umat:
    label: Ekonomi umat
    terms:
      3: [ekonomi umat, ekonomi syariah, ekonomi islam, perbankan syariah, keuangan syariah, bank syariah, industri halal, wakaf produktif, fintech syariah, koperasi syariah]
      2: [zakat, infak, wakaf, baznas, laznas, sukuk, pariwisata halal, dana haji, bpkh, bsi, bank syariah indonesia, amal usaha, kemandirian ekonomi, pasar halal, pasar muslim, negara muslim, saudagar muhammadiyah, pengusaha nu, bisnis muhammadiyah, ekonomi nahdliyin]
      1: [sedekah, umkm, halal, sertifikasi halal]

  pendidikan_sosial_keagamaan:
    label: Pendidikan dan sosial keagamaan
    terms:
      3: [pondok pesantren, pendidikan islam, pendidikan agama islam, madrasah, uu pesantren, majelis taklim, beasiswa santri]
      2: [pesantren, santri, dakwah, guru ngaji, tpq, pengajian, ormas islam, perguruan tinggi muhammadiyah, universitas muhammadiyah, ptma, ptnu, sekolah islam, islamic school, dikdasmen, lazismu, lazisnu, nu care, mdmc]
      1: [masjid, musala, kajian, kemenag, kementerian agama, bantuan kemanusiaan, relawan, tanggap bencana]

  keadilan_sosial:
    label: Keadilan sosial
    terms:
      3: [keadilan sosial, kriminalisasi ulama, ketidakadilan, kaum dhuafa, mustahik]
      2: [kesenjangan, ketimpangan, kemiskinan, dhuafa, diskriminasi, keadilan hukum, hak asasi manusia]
      1: [bansos, bantuan sosial, buruh, petani, rakyat kecil, ham]

  politik_kebijakan_publik:
    label: Politik kebijakan publik
    terms:
      3: [kebijakan publik, wajib halal, wajib sertifikasi halal, penundaan wajib halal, kuota haji, korupsi kuota haji, penyelenggaraan haji, kementerian haji, biaya haji, bpih, perda syariah, uu jaminan produk halal, ruu minuman beralkohol, ruu minol, ruu haluan ideologi pancasila, ruu hip, ruu kuhp, rkuhp]
      2: [kurikulum, rancangan undang-undang, ruu, undang-undang, peraturan daerah, perda, perpres, peraturan pemerintah, legislasi, regulasi, kebijakan pemerintah, omnibus law]
      1: [dpr, pemilu, pilkada, kpu, bawaslu, kebijakan]

  representasi_ulama_otoritas:
    label: Representasi ulama dan otoritas keagamaan
    terms:
      3: [majelis ulama indonesia, fatwa mui, ijtima ulama, bahtsul masail, majelis tarjih, otoritas keagamaan, rais aam, dewan syariah]
      2: [ulama, mui, fatwa, kiai, kyai, habib, ustaz, ustadz, buya, tuan guru, tokoh agama, pbnu, pp muhammadiyah, pwnu, pcnu, pwm muhammadiyah, pdm muhammadiyah, tanwir muhammadiyah, muktamar muhammadiyah, muktamar nu, haedar nashir, rais syuriyah, pimpinan pusat muhammadiyah, pengurus besar nahdlatul ulama, pernyataan sikap]
      1: [ustazah, ulil amri, pimpinan pesantren, muhammadiyah, nahdlatul ulama, aisyiyah, persyarikatan, muktamar, tanwir]

  partai_islam:
    label: Partai Islam
    terms:
      3: [partai islam, partai keadilan sejahtera, partai kebangkitan bangsa, partai persatuan pembangunan, partai amanat nasional, partai bulan bintang, partai ummat, partai masyumi, partai berbasis islam, partai berbasis massa islam]
      2: [pks, pkb, ppp, pan, partai gelora, masyumi, fraksi pks, fraksi pkb, fraksi ppp, fraksi pan]
      1: [koalisi partai islam, kader partai]
# Catatan revisi (run 1, Okt 2026): "haji"/"umrah" dikeluarkan dari pendidikan_sosial_keagamaan karena
# promosi travel haji dan kasus kuota haji ikut berlabel pendidikan; kebijakan haji kini di politik_kebijakan_publik.
# Catatan ambiguitas: "pbb" sengaja TIDAK dipakai (PBB = Perserikatan Bangsa-Bangsa /
# Pajak Bumi dan Bangunan / Partai Bulan Bintang). Gunakan "partai bulan bintang".

# Catatan revisi v2 (Nov 2026). Disusun dari 584 artikel run 3 + harian, DI LUAR 199 artikel sampel validasi
# (agar evaluasi tidak bias). Perubahan:
# - Diturunkan ke bobot 1 karena terlalu longgar: "hari santri" (20 label hanya karena menyebut tanggal),
#   "amanah", "akhlak", "adab" (kata kebajikan umum), "sertifikasi halal" di identitas/ekonomi.
# - Kebijakan wajib halal -> Politik kebijakan publik.
# - Ditambah: ormas sebagai aktor hanya lewat pimpinan/forum keputusan (PP Muhammadiyah, PWNU, tanwir/muktamar
#   Muhammadiyah/NU, pernyataan sikap); nama ormas saja = bobot 1 (acara sekolah/amal usaha bukan 'otoritas'), islamofobia dan
#   penghinaan nabi, mualaf, LGBT/asusila, ekonomi ormas (amal usaha, pengusaha NU), PT/sekolah Islam, lembaga
#   sosial ormas (LAZISMU, LAZISNU, MDMC), kurikulum.
# - Penyaring non-berita tambahan (kisah, contoh khutbah, tips, cara, fakta, hukum X menurut Islam).
# Revisi ini BELUM tervalidasi; bandingkan v1 vs v2 dengan validate.py setelah pengodean manual.
