# Daftar media berita online. Cukup isi domain: sitemap & RSS dicari otomatis
# (robots.txt -> Sitemap:, /sitemap.xml, /sitemap_index.xml, /news-sitemap.xml,
#  dan <link rel="alternate" type="application/rss+xml"> di beranda).
# Opsional per sumber: rss: [url, ...], sitemaps: [url, ...], stealth: true
# (pakai StealthyFetcher/browser untuk situs yang memblokir permintaan biasa).
# Tambah/hapus media sesuai kebutuhan penelitian.
defaults:
  delay_seconds: 2.5        # jeda antar-permintaan ke domain yang sama
  max_articles_per_source: 300
sources:
